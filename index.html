<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khanfx Hub - Automated Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cardbg: '#1e293b',
                        accent: '#10b981',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">

    <main class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div class="flex items-center space-x-3">
                <div id="status-dot" class="w-3 h-3 rounded-full bg-danger animate-pulse"></div>
                <h1 class="text-xl font-bold tracking-wider">KHANFX HUB</h1>
            </div>
            <div class="text-sm text-slate-400">Account Balance: <span id="account-balance" class="font-mono text-slate-100">$0.00</span></div>
        </header>

        <!-- Dashboard Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Controls Column -->
            <div class="bg-cardbg rounded-xl border border-slate-800 p-6 space-y-4 shadow-xl">
                <h2 class="text-md font-semibold text-slate-200 border-b border-slate-700 pb-2">Bot Controls</h2>
                
                <div class="space-y-1">
                    <label class="text-xs text-slate-400">Select Market</label>
                    <select id="market-select" class="bg-slate-900 border border-slate-700 text-slate-200 rounded p-2.5 w-full text-sm">
                        <option value="1HZ100V">Volatility 100 (1s) Index</option>
                        <option value="1HZ75V">Volatility 75 (1s) Index</option>
                        <option value="1HZ50V">Volatility 50 (1s) Index</option>
                        <option value="R_100">Volatility 100 Index</option>
                        <option value="R_75">Volatility 75 Index</option>
                        <option value="R_50">Volatility 50 Index</option>
                    </select>
                </div>

                <button id="toggle-bot" class="w-full bg-accent hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg transition shadow-lg">
                    LAUNCH BOT
                </button>
            </div>

            <!-- Market Info Column -->
            <div class="md:col-span-2 space-y-6">
                <!-- Live Price Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-cardbg rounded-xl border border-slate-800 p-5 shadow-xl">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Current Market Price</span>
                        <div id="current-price" class="text-3xl font-mono font-bold text-accent mt-2">0.0000</div>
                    </div>
                    <div class="bg-cardbg rounded-xl border border-slate-800 p-5 shadow-xl">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Last Digit (Real-time Tick)</span>
                        <div id="last-digit" class="text-3xl font-mono font-bold text-accent mt-2">0</div>
                    </div>
                </div>

                <!-- Execution Console -->
                <div class="bg-cardbg rounded-xl border border-slate-800 p-6 shadow-xl space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                        <h3 class="text-md font-semibold text-slate-200">Execution Console</h3>
                        <span class="text-sm text-slate-400">Total Profit: <span id="session-profit" class="font-mono font-bold text-accent">$0.00</span></span>
                    </div>

                    <!-- Log Output Container -->
                    <div id="log-window" class="h-64 bg-slate-950/90 rounded-lg p-4 font-mono text-xs overflow-y-auto space-y-2 border border-slate-900">
                        <p class="text-slate-500">> System initialized. Ready to launch...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Deriv API Execution Engine -->
    <script>
        const APP_ID = '33qUaFT0pPP4bUDrITabh';
        let ws;
        let currentSymbol = '1HZ100V';

        function getTimestamp() {
            return new Date().toLocaleTimeString();
        }

        function logMessage(message, colorClass = 'text-slate-400') {
            const logWindow = document.getElementById('log-window');
            const p = document.createElement('p');
            p.className = colorClass;
            p.innerText = `[${getTimestamp()}] ${message}`;
            logWindow.appendChild(p);
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        function connectWS() {
            logMessage('Initializing WebSocket connection...', 'text-slate-500');
            
            // Updated to use the modern derivws.com gateway endpoint structure
            ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

            ws.onopen = () => {
                logMessage('Successfully connected to KHANFX HUB infrastructure.', 'text-accent');
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-accent animate-pulse';
                subscribeToSymbol(currentSymbol);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.error) {
                        logMessage(`API Error: ${data.error.message}`, 'text-danger');
                        return;
                    }

                    if (data.msg_type === 'tick' && data.tick) {
                        const quote = data.tick.quote;
                        if (quote !== undefined) {
                            const quoteStr = quote.toString();
                            const digit = quoteStr.slice(-1);

                            document.getElementById('current-price').innerText = quoteStr;
                            document.getElementById('last-digit').innerText = digit;
                        }
                    }
                } catch (err) {
                    logMessage('Data parsing error encountered.', 'text-danger');
                }
            };

            ws.onerror = () => {
                logMessage('WebSocket Error. Check App ID or Deriv Restrictions.', 'text-danger');
            };

            ws.onclose = () => {
                logMessage('Connection lost. Attempting to reconnect in 3s...', 'text-danger');
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-danger animate-pulse';
                setTimeout(connectWS, 3000);
            };
        }

        function subscribeToSymbol(symbol) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ forget_all: "ticks" }));
                ws.send(JSON.stringify({
                    ticks: symbol,
                    subscribe: 1
                }));
                logMessage(`Switched stream to market: ${symbol}`, 'text-slate-300');
            }
        }

        document.getElementById('market-select').addEventListener('change', (e) => {
            currentSymbol = e.target.value;
            subscribeToSymbol(currentSymbol);
        });

        connectWS();
    </script>
</body>
</html>
