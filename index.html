<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khanfx Hub - Auto Trader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#22c55e',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></div>
            <h1 class="text-xl font-bold tracking-wide text-white">KHANFX <span class="text-emerald-500">HUB</span></h1>
        </div>
        <div class="text-right">
            <p class="text-xs text-slate-400">Account Balance</p>
            <p class="text-lg font-mono font-bold text-emerald-400" id="balance">$0.00</p>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Controls Column -->
        <div class="bg-cardbg rounded-xl border border-slate-800 p-6 space-y-5 shadow-xl">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-800 pb-3">Bot Strategy Settings</h2>

            <!-- Symbol Selection -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">Market Symbol</label>
                <select id="symbol" onchange="switchSymbol()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                    <option value="R_100">Volatility 100 Index</option>
                    <option value="R_75">Volatility 75 Index</option>
                    <option value="R_50">Volatility 50 Index</option>
                    <option value="1HZ10V">Volatility 10 (1s) Index</option>
                </select>
            </div>

            <!-- Strategy Selector -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">Digit Strategy</label>
                <select id="strategy" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                    <option value="DIGITOVER">Matches / Digit Over</option>
                    <option value="DIGITUNDER">Matches / Digit Under</option>
                    <option value="DIGITDIFF">Digit Differ</option>
                </select>
            </div>

            <!-- Risk Management Input Fields -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Initial Stake ($)</label>
                    <input type="number" id="stake" value="1.00" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Martingale (x)</label>
                    <input type="number" id="multiplier" value="2.1" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Target Profit ($)</label>
                    <input type="number" id="target-profit" value="10.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Stop Loss ($)</label>
                    <input type="number" id="stop-loss" value="20.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- Toggle Execution Button -->
            <button id="btn-toggle" onclick="toggleBot()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold tracking-wider rounded-lg transition-all duration-200 shadow-lg shadow-emerald-500/20">
                START AUTOMATED BOT
            </button>
        </div>

        <!-- Displays & Terminal Output -->
        <div class="lg:col-span-2 space-y-6">

            <!-- Live Market Feed Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-cardbg rounded-xl border border-slate-800 p-6 shadow-xl">
                    <p class="text-xs text-slate-400">Current Market Price</p>
                    <p class="text-3xl font-mono font-bold text-white mt-2" id="live-quote">0.0000</p>
                </div>
                <div class="bg-cardbg rounded-xl border border-slate-800 p-6 shadow-xl flex justify-between items-center">
                    <div>
                        <p class="text-xs text-slate-400">Last Digit</p>
                        <p class="text-xs text-slate-500 mt-1">Real-time Tick stream</p>
                    </div>
                    <p class="text-5xl font-mono font-black text-emerald-400" id="last-digit">0</p>
                </div>
            </div>

            <!-- Real-time Console Logs -->
            <div class="bg-cardbg rounded-xl border border-slate-800 p-6 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="text-md font-semibold text-slate-200">Execution Console</h3>
                    <div class="text-sm">
                        <span class="text-slate-400">Total Profit:</span> 
                        <span id="session-profit" class="font-mono font-bold text-emerald-400">$0.00</span>
                    </div>
                </div>

                <!-- Log Output Container -->
                <div id="log-window" class="h-64 bg-slate-950/90 rounded-lg p-4 font-mono text-xs overflow-y-auto space-y-1.5 border border-slate-900 text-slate-300">
                    <p class="text-slate-500">> System initialized. Ready to launch...</p>
                </div>
            </div>

        </div>

    </main>

    <!-- Deriv API Execution Engine -->
    <script>
        const APP_ID = '33qUaFT0pPP4bUDrITabh';

 // Your Khanfx Hub App ID
        let ws;
        let isRunning = false;
        let currentReqId = 1;

        function connectWS() {
            ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

            ws.onopen = () => {
                logMessage('Successfully connected to Khanfx Hub infrastructure', 'text-emerald-400');
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse';
                subscribeTick();
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                // Live Tick Stream Handler
                if (data.msg_type === 'tick') {
                    const quote = data.tick.quote;
                    const digit = quote.toString().slice(-1);
                    document.getElementById('live-quote').innerText = quote;
                    document.getElementById('last-digit').innerText = digit;

                    if (isRunning) {
                        logMessage(`[TICK ANALYZER] Price: ${quote} | Digit: ${digit}`, 'text-slate-400');
                    }
                }
            };

            ws.onerror = (err) => {
                logMessage('WebSocket Error. Reconnecting...', 'text-red-400');
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-red-500';
            };
        }

        function subscribeTick() {
            const symbol = document.getElementById('symbol').value;
            ws.send(JSON.stringify({ 
                ticks: symbol, 
                subscribe: 1 
            }));
        }

        function switchSymbol() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ forget_all: 'ticks' }));
                subscribeTick();
                logMessage(`Switched market stream to: ${document.getElementById('symbol').value}`, 'text-amber-400');
            }
        }

        function logMessage(msg, colorClass = 'text-slate-300') {
            const logWin = document.getElementById('log-window');
            const time = new Date().toLocaleTimeString();
            logWin.innerHTML += `<p class="${colorClass}">[${time}] ${msg}</p>`;
            logWin.scrollTop = logWin.scrollHeight;
        }

        function toggleBot() {
            const btn = document.getElementById('btn-toggle');
            isRunning = !isRunning;

            if (isRunning) {
                btn.innerText = 'HALT AUTOMATED BOT';
                btn.className = 'w-full py-3.5 bg-red-500 hover:bg-red-600 text-white font-extrabold tracking-wider rounded-lg transition-all duration-200 shadow-lg shadow-red-500/20';
                logMessage('>>> BOT ENGINE STARTED - Continuous execution active', 'text-emerald-400 font-bold');
            } else {
                btn.innerText = 'START AUTOMATED BOT';
                btn.className = 'w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold tracking-wider rounded-lg transition-all duration-200 shadow-lg shadow-emerald-500/20';
                logMessage('>>> BOT ENGINE STOPPED', 'text-amber-400 font-bold');
            }
        }

        // Initialize Live Feed
        connectWS();
    </script>
</body>
</html>
