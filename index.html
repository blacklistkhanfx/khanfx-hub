<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khanfx Hub - Auto Trader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#22c55e',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-200 font-sans min-h-screen p-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-red-500"></div>
            <h1 class="text-2xl font-bold tracking-wider text-slate-100">KHANFX <span class="text-accent">HUB</span></h1>
        </div>
        <div class="text-right">
            <p class="text-xs text-slate-400">Account Balance</p>
            <p class="text-lg font-mono font-bold text-slate-100" id="account-balance">$0.00</p>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Settings -->
        <div class="bg-cardbg rounded-xl border border-slate-800 p-6 shadow-xl lg:col-span-1 h-fit">
            <h2 class="text-lg font-semibold mb-6 text-slate-200">Bot Strategy Settings</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Market Symbol</label>
                    <select class="w-full bg-darkbg border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-accent focus:ring-1 focus:ring-accent outline-none">
                        <option value="R_100">Volatility 100 Index</option>
                        <option value="R_50">Volatility 50 Index</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Digit Strategy</label>
                    <select class="w-full bg-darkbg border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-accent focus:ring-1 focus:ring-accent outline-none">
                        <option>Matches / Digit Over</option>
                        <option>Differs</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Initial Stake ($)</label>
                        <input type="number" value="1.00" class="w-full bg-darkbg border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-accent outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Martingale (x)</label>
                        <input type="number" value="2.1" class="w-full bg-darkbg border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-accent outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Target Profit ($)</label>
                        <input type="number" value="10.00" class="w-full bg-darkbg border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-accent outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Stop Loss ($)</label>
                        <input type="number" value="20.00" class="w-full bg-darkbg border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-accent outline-none">
                    </div>
                </div>

                <button id="start-btn" class="w-full mt-4 bg-accent hover:bg-emerald-400 text-slate-900 font-bold py-3 rounded-lg uppercase tracking-wider transition-colors duration-200">
                    Start Automated Bot
                </button>
            </div>
        </div>

        <!-- Right Column: Data & Console -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Live Data Display -->
            <div class="grid grid-cols-2 gap-6">
                <div class="bg-cardbg rounded-xl border border-slate-800 p-6 shadow-xl flex flex-col justify-center">
                    <p class="text-xs text-slate-400">Current Market Price</p>
                    <p class="text-4xl font-mono font-bold text-slate-100 mt-2" id="live-quote">0.0000</p>
                </div>
                <div class="bg-cardbg rounded-xl border border-slate-800 p-6 shadow-xl flex flex-col justify-center items-end text-right">
                    <p class="text-xs text-slate-400">Last Digit</p>
                    <p class="text-xs text-slate-500 mt-1 mb-2">Real-time Tick stream</p>
                    <p class="text-5xl font-mono font-black text-accent" id="last-digit">0</p>
                </div>
            </div>

            <!-- Execution Console -->
            <div class="bg-cardbg rounded-xl border border-slate-800 p-6 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="text-md font-semibold text-slate-200">Execution Console</h3>
                    <div class="text-sm">
                        <span class="text-slate-400">Total Profit: </span>
                        <span id="session-profit" class="font-mono font-bold text-accent">$0.00</span>
                    </div>
                </div>

                <!-- Log Output Container -->
                <div id="log-window" class="h-64 bg-slate-950/90 rounded-lg p-4 font-mono text-xs overflow-y-auto space-y-1">
                    <p class="text-slate-500">> System initialized. Ready to launch...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Deriv API Execution Engine -->
    <script>
        const APP_ID = '33qUaFT0pPP4bUDrITabh'; // Active Khanfx Hub App ID
        let ws;
        let isRunning = false;
        
        function getTimestamp() {
            return new Date().toLocaleTimeString();
        }

        function logMessage(message, colorClass = 'text-slate-400') {
            const logWindow = document.getElementById('log-window');
            const p = document.createElement('p');
            p.className = colorClass;
            p.innerText = `[${getTimestamp()}] ${message}`;
            logWindow.appendChild(p);
            logWindow.scrollTop = logWindow.scrollHeight; // Auto-scroll
        }

        function connectWS() {
            logMessage('Initializing WebSocket connection...', 'text-slate-500');
            
            // Using binaryws.com for extreme stability & avoiding redirect blockages
            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);

            ws.onopen = () => {
                logMessage('Successfully connected to KHANFX HUB infrastructure.', 'text-accent');
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-accent animate-pulse';
                
                // Subscribe to Volatility 100 Index by default
                ws.send(JSON.stringify({
                    ticks: "R_100",
                    subscribe: 1
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.error) {
                    logMessage(`API Error: ${data.error.message}`, 'text-danger');
                    return;
                }

                if (data.msg_type === 'tick') {
                    const quote = data.tick.quote;
                    const digit = quote.toString().slice(-1); // Get last digit
                    
                    document.getElementById('live-quote').innerText = quote;
                    document.getElementById('last-digit').innerText = digit;
                    
                    if (isRunning) {
                        logMessage(`Tick Processed -> Price: ${quote} | Digit: [${digit}]`, 'text-slate-300');
                    }
                }
            };

            ws.onclose = () => {
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-danger';
                logMessage('Connection lost. Attempting to reconnect in 3s...', 'text-danger');
                setTimeout(connectWS, 3000);
            };

            ws.onerror = (error) => {
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-danger';
                logMessage('WebSocket Error. Check App ID or Deriv Restrictions.', 'text-danger');
            };
        }

        // Button Control
        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                startBtn.innerText = 'STOP AUTOMATED BOT';
                startBtn.className = 'w-full mt-4 bg-danger hover:bg-red-500 text-slate-100 font-bold py-3 rounded-lg uppercase tracking-wider transition-colors duration-200';
                logMessage('>>> AUTOMATED TRADING PROTOCOL INITIATED <<<', 'text-accent');
            } else {
                startBtn.innerText = 'START AUTOMATED BOT';
                startBtn.className = 'w-full mt-4 bg-accent hover:bg-emerald-400 text-slate-900 font-bold py-3 rounded-lg uppercase tracking-wider transition-colors duration-200';
                logMessage('>>> TRADING PROTOCOL STOPPED <<<', 'text-danger');
            }
        });

        // Initialize on page load
        connectWS();
    </script>
</body>
</html>
